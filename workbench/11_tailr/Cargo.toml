[package]
name = "tailr"
version = "0.1.0"
authors = ["yohei.kuro48@@gmail.com"]
description = "A simple tail-like tool"
edition = "2024"

[dependencies]
anyhow = "~1.0.97"
clap = { version = "~4.5.37", features = ["derive"] }
env_logger = "~0.11.7"
log = "~0.4.26"
regex = { version = "~1.11.1", features = ["unicode"] }
csv = "~1.3.1"
walkdir = "~2.5.0"
sys-info = "~0.9.1"
itertools = "~0.14.0"
num = "~0.4.3"
once_cell = "~1.21.3"

[dev-dependencies]
assert_cmd = "~2.0.17"
predicates = "~3.1.3"
pretty_assertions = "~1.4.1"
tempfile = "~3.19.1"
rand = "~0.9.1"
