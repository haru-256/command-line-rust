[package]
name = "cutr"
version = "0.1.0"
authors = ["yohei.kuro48@@gmail.com"]
description = "A simple command of cut"
edition = "2024"

[dependencies]
anyhow = "~1.0.97"
clap = { version = "~4.5.37", features = ["derive"] }
